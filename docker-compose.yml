# Local development database. The client's Windows PC uses the native
# PostgreSQL 18 installer instead; see docs/database.md.
#
#   docker compose up -d        start (data persists in the dinos-pgdata volume)
#   docker compose down         stop, keep data
#   docker compose down -v      stop and DELETE all local data
#
# Credentials come from .env (copy .env.example). Compose reads that file
# automatically for the ${...} values below.
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${DINOS_DB_NAME:?Set DINOS_DB_NAME in .env}
      POSTGRES_USER: ${DINOS_DB_USER:?Set DINOS_DB_USER in .env}
      POSTGRES_PASSWORD: ${DINOS_DB_PASSWORD:?Set DINOS_DB_PASSWORD in .env}
      # Built-in C.UTF-8 collation sorts and compares text identically on
      # macOS, Linux, and Windows, unlike OS-provided locales.
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8
    ports:
      # Bound to localhost only, so the database is not exposed to the network.
      - "127.0.0.1:${DINOS_DB_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<major>/.
      - dinos-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  dinos-pgdata:
