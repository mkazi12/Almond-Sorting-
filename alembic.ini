# Alembic CLI configuration for developers. Connection settings come from
# .env (see app/storage/config.py), not from this file.
#
#   alembic upgrade head                          apply pending migrations
#   alembic current                               show the database's revision
#   alembic revision --autogenerate -m "message"  draft a migration from models.py
#
# The app itself runs `python -m app.storage migrate`, which does not need
# this file. See docs/database.md for the migration workflow.

[alembic]
script_location = %(here)s/app/storage/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
